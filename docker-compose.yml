services:
  postgres:
    image: postgres:16-alpine
    container_name: medispeech-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medispeech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Langfuse v2 — only needs PostgreSQL (v3 requires ClickHouse + MinIO + Redis)
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: medispeech-langfuse
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_SECRET: REDACTED
      SALT: REDACTED
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:16-alpine
    container_name: medispeech-langfuse-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  transcription:
    build:
      context: ./services
      dockerfile: transcription/Dockerfile
    container_name: medispeech-transcription
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      WHISPER_MODEL: base
      HF_TOKEN: ${HF_TOKEN:-}
      LANGFUSE_HOST: http://langfuse-server:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      langfuse-server:
        condition: service_started
    restart: unless-stopped

  llm:
    build:
      context: ./services
      dockerfile: llm/Dockerfile
    container_name: medispeech-llm
    environment:
      HOST: 0.0.0.0
      PORT: "8002"
      BIOGPT_MODEL: microsoft/BioGPT
      LANGFUSE_HOST: http://langfuse-server:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
    ports:
      - "8002:8002"
    depends_on:
      langfuse-server:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medispeech-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/medispeech
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: INFO
      TRANSCRIPTION_SERVICE_URL: http://transcription:8001
      LLM_SERVICE_URL: http://llm:8002
      LANGFUSE_HOST: http://langfuse-server:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      transcription:
        condition: service_started
      llm:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - audio_data:/audio
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  langfuse_postgres_data:
  audio_data:
  hf_cache:
