apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: medispeech
  labels:
    app: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
    name: http

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: medispeech
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
    name: postgres
