apiVersion: v1
kind: ConfigMap
metadata:
  name: medispeech-config
  namespace: medispeech
data:
  postgres_user: postgres
  postgres_db: medispeech
  log_level: INFO
  whisper_model_path: /models/whisper-base
  llm_model_path: /models/biogpt

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: medispeech
type: Opaque
stringData:
  password: "change-me-in-production"

---
apiVersion: v1
kind: Secret
metadata:
  name: database-url
  namespace: medispeech
type: Opaque
stringData:
  url: "postgresql+asyncpg://postgres:change-me-in-production@postgres:5432/medispeech"
