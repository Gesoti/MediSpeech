[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medispeech-llm"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.1.0",
    "transformers>=4.36",
    "torch>=2.1",
    "sacremoses>=0.0.53",
    "langfuse>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
